<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111110">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Banquillo · Estadística en directo</title>
<style>
:root{--bg:#f4f3ef;--card:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--line:#e1e0d9;--axis:#c3c2b7;
--A:#2a78d6;--B:#eb6834;--ok:#0b8a3e;--ko:#c93b3a;--chip:#ebeae4;--sel:#0b0b0b;--warn:#b26b00}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
--line:#2c2c2a;--axis:#383835;--A:#3987e5;--B:#d95926;--ok:#2fb35f;--ko:#e66767;--chip:#262624;--sel:#f0efec;--warn:#e0a030}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--axis);border-radius:10px;padding:10px;width:100%}
textarea{min-height:170px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
#app{max-width:1280px;margin:0 auto;padding:10px 12px 90px}
h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{padding:12px 16px;border-radius:12px;background:var(--chip);font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg)}.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.35}
.muted{color:var(--muted)}.small{font-size:12px}
label{font-size:13px;color:var(--ink2);display:block;margin:10px 0 4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
/* marcador */
.score{position:sticky;top:0;z-index:10;background:var(--bg);padding:6px 0 8px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.sc-team{display:flex;align-items:center;gap:8px;min-width:0}.sc-team.r{justify-content:flex-end}
.sc-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-pts{font-size:34px;font-weight:800;line-height:1}
.sc-mid{text-align:center}
.clock{font-size:26px;font-weight:800;padding:4px 14px;border-radius:12px;background:var(--chip);min-width:118px}
.clock.run{background:var(--ok);color:#fff}
.qlab{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.06em}
.tf{font-size:11px;color:var(--muted)}.tf b.bonus{color:var(--ko)}
/* anotación */
.board{display:grid;gap:10px;grid-template-columns:1fr;}
@media (min-width:900px){.board{grid-template-columns:1fr 1.25fr 1fr}}
.team{border-top:4px solid var(--c)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
@media (min-width:900px){.plist{grid-template-columns:1fr 1fr}}
.pl{background:var(--chip);border-radius:12px;padding:10px 8px;text-align:left;min-height:62px;position:relative;border:2px solid transparent}
.pl .n{font-size:22px;font-weight:800;line-height:1}.pl .nm{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .f{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--muted)}
.pl .f.w{color:var(--warn)}.pl .f.x{color:var(--ko)}
.pl .p{position:absolute;bottom:6px;right:8px;font-size:12px;font-weight:700}
.pl.on{border-color:var(--sel);background:var(--card)}
.tbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{background:var(--chip);border-radius:12px;min-height:58px;font-weight:700;font-size:15px;padding:6px 4px;line-height:1.15}
.act small{display:block;font-weight:500;font-size:11px;color:var(--ink2)}
.act.m{background:color-mix(in srgb,var(--ok) 18%,var(--chip))}.act.x{background:color-mix(in srgb,var(--ko) 15%,var(--chip))}
.prompt h3{margin-top:0}.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.choice{background:var(--chip);border-radius:12px;min-height:54px;font-weight:700;padding:6px}
.choice small{display:block;font-weight:500;font-size:11px;color:var(--ink2)}
.hint{color:var(--muted);text-align:center;padding:24px 8px}
.last{font-size:13px;color:var(--ink2);margin-top:8px;min-height:20px}
/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:180px;padding:10px 6px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:var(--bg)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
/* informe */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.seg button{padding:7px 13px;border-radius:999px;background:var(--chip);font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 5px;border-bottom:1px solid var(--axis);white-space:nowrap}
td{text-align:right;padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.key{padding:9px 11px;border-radius:10px;background:var(--chip);margin:6px 0;font-size:14px}
.key b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
.bad{border-left:4px solid var(--ko)}.good{border-left:4px solid var(--ok)}.info{border-left:4px solid var(--axis)}
.mir{display:grid;grid-template-columns:64px 1fr 1fr 64px;gap:0 6px;align-items:center;font-size:13px;margin:3px 0}
.mir .l{grid-column:1/5;text-align:center;font-size:12px;color:var(--ink2);margin-top:6px}
.mir .a{text-align:right;font-weight:700}.mir .b{font-weight:700}.mir small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.bar{height:10px;background:var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:4px}.bar.a i{right:0;background:var(--A)}.bar.b i{left:0;background:var(--B)}
.win{font-weight:800}
.log td{white-space:normal}.log .del{color:var(--ko);font-weight:700;padding:4px 8px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600}

/* ===== rediseño visual ===== */
:root{--made:#15803d;--miss:#c0262d;--reb:#1d4ed8;--play:#6d28d9;--tov:#c2410c;--foul:#a16207}
.score{grid-template-columns:1fr auto 1fr;padding:8px 0 10px}
.sc-team{background:var(--card);border-radius:16px;padding:8px 12px;border:1px solid var(--line);box-shadow:inset 6px 0 0 var(--c)}
.sc-team.r{box-shadow:inset -6px 0 0 var(--c)}
.sc-pts{font-size:44px;letter-spacing:-.03em}
.clock{font-size:32px;min-width:140px;padding:6px 16px;border-radius:14px}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--ink2)}.pips.hot i.on{background:var(--miss)}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.alert{font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--k) 14%,var(--card));border:1px solid color-mix(in srgb,var(--k) 45%,transparent)}
.plist{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
@media (min-width:900px){.plist{grid-template-columns:1fr 1fr}}
.pl{min-height:88px;padding:10px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:inset 0 5px 0 var(--c)}
.pl .n{font-size:32px}.pl .nm{font-size:13px;margin-top:2px}
.pl .p{bottom:8px;right:10px;font-size:15px;font-weight:800}
.pl .nm{margin-bottom:14px}
.pl .f{top:12px;right:10px}
.pl.on{background:var(--c);border-color:var(--c);color:#fff}.pl.on .nm,.pl.on .p{color:#fff}
.pl.on .pips i{background:rgba(255,255,255,.35)}.pl.on .pips i.on{background:#fff}
.pl.out5{opacity:.45}
.team{border-top:6px solid var(--c)}
.tbtns .btn{flex:1;padding:12px 8px;font-size:14px}
.pad{grid-template-columns:repeat(3,1fr);gap:10px}
.act{min-height:76px;font-size:20px;border-radius:16px;color:#fff;background:var(--k);font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.act small{color:rgba(255,255,255,.85);font-size:12px;font-weight:600}
.act:active{transform:scale(.97)}
.act.wide{grid-column:1/-1;min-height:48px;font-size:15px;background:var(--chip);color:var(--ink);box-shadow:none}
.padlab{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.selhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 10px;border-radius:12px;background:var(--c);color:#fff}
.selhead .big{font-size:26px;font-weight:800}
.choices{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.choice{min-height:68px;font-size:22px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:inset 0 5px 0 var(--c,transparent)}
.choice small{font-size:12px}
.choice.skip{font-size:14px;background:var(--chip);border-color:transparent;box-shadow:none}
.choice.yes{background:var(--made);color:#fff;border:0;font-size:24px;min-height:96px}
.choice.no{background:var(--miss);color:#fff;border:0;font-size:24px;min-height:96px}
.prompt h3{font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:var(--bg);
 border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:94vw}
.toast i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--k);margin-right:8px}
.toast button{background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700}
@media (max-width:600px){
 .score{gap:6px}.sc-team{flex-direction:column;align-items:flex-start;padding:6px 8px;gap:0}.sc-team.r{align-items:flex-end}
 .sc-team .grow{display:none}.sc-pts{font-size:34px;order:-1}.sc-name{font-size:12px;max-width:100%}
 .sc-team .pips{display:none}.clock{font-size:24px;min-width:100px;padding:4px 10px}
 .pl{min-height:78px}.pl .n{font-size:26px}.pl .f{top:9px;right:8px}.pips i{width:6px;height:6px}
 .act{min-height:68px;font-size:18px}
}
.goals{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.goal{font-size:13px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.goal i{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.goal b{font-weight:800}
.gl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border:0}.gl .sem{width:16px;height:16px;border-radius:50%;background:var(--k);flex:none}
.gl .lab{flex:1}.gl .val{font-weight:800;font-size:18px}.gl .sub{font-size:12px;color:var(--muted)}
.gedit{display:grid;grid-template-columns:auto 1fr 90px;gap:8px 10px;align-items:center}
.gedit input[type=number]{padding:8px;text-align:center}.gedit input[type=checkbox]{width:22px;height:22px}
.stint{position:absolute;bottom:8px;left:10px;font-size:12px;font-weight:700;color:var(--muted)}
.stint.w{color:var(--foul)}.stint.x{color:var(--miss)}
.pl.on .stint{color:#fff}
.tm h2{font-size:24px}.tm .card{margin-bottom:10px}
.tmgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kits{display:flex;gap:8px;flex-wrap:wrap}
.kit{width:38px;height:38px;border-radius:50%;background:var(--k);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.kit.on{box-shadow:0 0 0 3px var(--ink)}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<script>
"use strict";
/* ============================================================
   Banquillo — estadística en directo a partir del play-by-play
   Todo se guarda en este dispositivo (localStorage).
   ============================================================ */
const KEY = "banquillo-v1", ROSTER_KEY = "banquillo-plantilla";
const QLEN = q => q <= 4 ? 600 : 300;
const OTHER = {A: "B", B: "A"};
const PTS = {"2FGM": 2, "3FGM": 3, "FTM": 1};
const FOULS = ["CM", "CMU", "CMT", "OF"];
const OWN_BALL = ["2FGM", "2FGA", "3FGM", "3FGA", "FTM", "FTA", "TO", "O", "OF"];
const LABEL = {"2FGM":"Canasta de 2","2FGA":"Fallo de 2","3FGM":"Triple","3FGA":"Fallo de 3","FTM":"TL anotado","FTA":"TL fallado",
  "O":"Rebote ofensivo","D":"Rebote defensivo","AS":"Asistencia","ST":"Robo","TO":"Pérdida","FV":"Tapón","AG":"Tapón recibido",
  "CM":"Falta","CMU":"Antideportiva","CMT":"Técnica","OF":"Falta en ataque","RV":"Falta recibida","IN":"Entra","OUT":"Sale","TOUT":"Tiempo muerto"};

let S, tick = null, view = "setup", rfilter = "all", sel = null, prompt = null, modal = null, toast = null, toastT = null;
const KITS = ["#1f6fd1", "#d23b3b", "#1f9d55", "#e0a800", "#ea6a1f", "#7a4bd1", "#0f766e", "#db2777", "#334155", "#94a3b8"];
const ACOL = {"2FGM":"made","3FGM":"made","FTM":"made","2FGA":"miss","3FGA":"miss","FTA":"miss","O":"reb","D":"reb",
  "AS":"play","ST":"play","FV":"play","TO":"tov","OF":"foul","CM":"foul","RV":"foul","CMU":"foul","CMT":"foul","AG":"miss","TOUT":"reb"};
function applyKits() {
  const c = (S.game && S.game.colors) || S.setup.colors || {A: KITS[0], B: KITS[4]};
  document.documentElement.style.setProperty("--A", c.A); document.documentElement.style.setProperty("--B", c.B);
}
function showToast(e) {
  const who = e.pid ? pshort(e.pid) : tname(e.side);
  toast = {text: `${LABEL[e.type] || e.type} · ${who}`, k: ACOL[e.type] || "reb"};
  clearTimeout(toastT); toastT = setTimeout(() => { toast = null; render(); }, 3500);
  try { navigator.vibrate && navigator.vibrate(12); } catch (x) {}
}

function load() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.toISOString().slice(0, 10); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function mmss(r) { r = Math.max(0, Math.ceil(r)); return String(Math.floor(r / 60)).padStart(2, "0") + ":" + String(r % 60).padStart(2, "0"); }
function minfmt(s) { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function pct(m, a) { return a ? Math.round(100 * m / a) + "%" : "–"; }
function qlab(q) { return q <= 4 ? q + "C" : (q === 5 ? "PR" : "PR" + (q - 4)); }

function fresh() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(ROSTER_KEY)); } catch (e) {}
  return {setup: {date: today(), hour: "", jornada: "", venue: "", us: "A",
    teams: {A: {name: saved?.name || "", roster: saved?.roster || ""}, B: {name: "", roster: ""}}}, game: null};
}
S = load() || fresh();
if (S.game) view = "game";

/* ---------------- plantillas ---------------- */
function parseRoster(txt, side) {
  const out = [], seen = new Set();
  for (const line of (txt || "").split(/\n|,/)) {
    const m = line.trim().match(/^#?\s*(\d{1,2})\s*[-.·]?\s*(.*)$/);
    if (!m || seen.has(m[1])) continue;
    seen.add(m[1]);
    out.push({id: side + m[1], num: m[1], name: m[2].trim()});
  }
  return out;
}
function players(side) { return S.game ? S.game.players[side] : []; }
function pinfo(id) { if (!id) return null; return S.game.players[id[0]].find(p => p.id === id) || {id, num: id.slice(1), name: ""}; }
function pshort(id) { const p = pinfo(id); return p ? "#" + p.num + (p.name ? " " + p.name : "") : "Equipo"; }
function tname(s) { return S.game.teams[s].name || (s === "A" ? "Local" : "Visitante"); }
function tcode(s) { return S.game.teams[s].code; }
function mkcode(name, fb) { const w = (name || "").normalize("NFD").replace(/[^A-Za-z ]/g, "").trim().split(/\s+/).filter(x => x.length > 2);
  const c = (w[w.length - 1] || w[0] || fb).toUpperCase().slice(0, 3); return c.length === 3 ? c : fb; }

/* ---------------- reloj ---------------- */
function curRem() { const g = S.game; if (!g.running) return g.rem; return Math.max(0, g.remStart - (Date.now() - g.t0) / 1000); }
function toggleClock() {
  const g = S.game;
  if (g.running) { g.rem = curRem(); g.running = false; }
  else { if (g.rem <= 0) return; g.running = true; g.t0 = Date.now(); g.remStart = g.rem; }
  save(); render();
}
function adjClock(d) { const g = S.game; const r = Math.min(QLEN(g.q), Math.max(0, curRem() + d)); g.rem = r; if (g.running) { g.remStart = r; g.t0 = Date.now(); } save(); render(); }
function startTicker() {
  if (tick) clearInterval(tick);
  tick = setInterval(() => {
    if (!S.game) return;
    const el = document.getElementById("clk");
    const r = curRem();
    if (el) el.textContent = mmss(r);
    if (S.game.running && r <= 0) { S.game.rem = 0; S.game.running = false; save(); render(); return; }
    if (S.game.running && view === "game" && !modal && !prompt && !sel && Date.now() - (window._lr || 0) > 5000) { window._lr = Date.now(); render(); }
  }, 250);
}

/* ---------------- tiempo de juego, minutos seguidos y descanso ---------------- */
function gt(q, rem) { return (q <= 4 ? 600 * (q - 1) : 2400 + 300 * (q - 5)) + QLEN(q) - rem; }
function stints() {
  // segundos seguidos en pista (o descansando) de cada jugador; el descanso del medio tiempo reinicia
  const g = S.game, inT = {}, outT = {};
  let prev = {A: [], B: []};
  for (let q = 1; q <= g.q; q++) {
    if (!g.starts[q]) continue;
    const b = gt(q, QLEN(q)), on = {A: [...g.starts[q].A], B: [...g.starts[q].B]};
    for (const s of "AB") {
      for (const id of on[s]) if (!prev[s].includes(id) || q === 3) inT[id] = b;
      for (const id of prev[s]) if (!on[s].includes(id)) outT[id] = b;
    }
    for (const e of g.events) {
      if (e.q !== q) continue;
      const t = gt(q, e.rem);
      if (e.type === "IN" && !on[e.side].includes(e.pid)) { on[e.side].push(e.pid); inT[e.pid] = t; }
      if (e.type === "OUT") { on[e.side] = on[e.side].filter(x => x !== e.pid); outT[e.pid] = t; }
    }
    prev = on;
  }
  const now = gt(g.q, curRem()), r = {};
  for (const s of "AB") for (const p of g.players[s])
    r[p.id] = prev[s].includes(p.id) ? {on: true, sec: Math.max(0, now - (inT[p.id] ?? 0))} : {on: false, sec: outT[p.id] != null ? Math.max(0, now - outT[p.id]) : null};
  return r;
}
function tired() { return (S.game && S.game.tiredMin) || 6; }
function stintCls(sec) { const t = tired() * 60; return sec >= t + 120 ? "x" : sec >= t ? "w" : ""; }

/* ---------------- objetivos del partido ---------------- */
const GOALS = [
  {id: "tov", label: "Nuestras pérdidas", op: "<=", def: 12, get: (R, u, r) => R.T[u].TOV},
  {id: "oreb_r", label: "Rebotes ofensivos del rival", op: "<=", def: 10, get: (R, u, r) => R.T[r].OREB},
  {id: "fta", label: "Tiros libres que lanzamos", op: ">=", def: 15, get: (R, u, r) => R.T[u].FTA},
  {id: "oreb_u", label: "Nuestros rebotes ofensivos", op: ">=", def: 10, get: (R, u, r) => R.T[u].OREB},
  {id: "ast", label: "Nuestras asistencias", op: ">=", def: 12, get: (R, u, r) => R.T[u].AST},
  {id: "pf", label: "Faltas que cometemos", op: "<=", def: 18, get: (R, u, r) => R.T[u].PF},
  {id: "pa", label: "Puntos que encajamos", op: "<=", def: 55, get: (R, u, r) => R.T[r].PTS},
  {id: "3pm_r", label: "Triples anotados por el rival", op: "<=", def: 5, get: (R, u, r) => R.T[r]["3PM"]},
  {id: "pto_r", label: "Puntos del rival tras nuestras pérdidas", op: "<=", def: 10, get: (R, u, r) => R.X[r].pto},
  {id: "fast_r", label: "Puntos del rival en transición", op: "<=", def: 8, get: (R, u, r) => R.X[r].fast},
  {id: "efg_r", label: "Tiro efectivo del rival (eFG%)", op: "<=", def: 45, pct: true, get: (R, u, r) => R.F[r].efg == null ? null : R.F[r].efg * 100},
  {id: "orb_r", label: "% de rebote ofensivo del rival", op: "<=", def: 30, pct: true, get: (R, u, r) => R.F[r].orb == null ? null : R.F[r].orb * 100},
];
const DEF_GOALS = {tov: 12, oreb_r: 10, fta: 15};
function goalList(obj) { return GOALS.filter(gd => obj && obj[gd.id] != null).map(gd => Object.assign({}, gd, {target: +obj[gd.id]})); }
function evalGoals(R) {
  const g = S.game, u = S.setup.us, r = OTHER[u];
  const el = gt(g.q, curRem()), frac = g.final ? 1 : Math.min(1, Math.max(el, 1) / 2400);
  return goalList(g.goals).map(gd => {
    const v = gd.get(R, u, r), t = gd.target;
    let st = "na", note = "";
    if (v == null || isNaN(v)) return {gd, v: null, st, note: "sin datos aún"};
    if (gd.pct) {
      const d = gd.op === "<=" ? t - v : v - t;
      st = d >= 0 ? "ok" : d >= -4 ? "warn" : "bad";
    } else {
      const proj = frac >= .08 ? v / frac : null;
      if (gd.op === "<=") {
        if (v > t) { st = "bad"; note = "superado"; }
        else if (g.final || proj == null) st = "ok";
        else { st = proj <= t ? "ok" : proj <= t * 1.15 ? "warn" : "bad"; note = `a este ritmo, ${Math.round(proj)}`; }
      } else {
        if (v >= t) { st = "ok"; note = "conseguido"; }
        else if (g.final) st = "bad";
        else if (proj == null) st = "warn";
        else { st = proj >= t ? "ok" : proj >= t * .85 ? "warn" : "bad"; note = `a este ritmo, ${Math.round(proj)}`; }
      }
    }
    return {gd, v, st, note};
  });
}
const SEMK = {ok: "made", warn: "foul", bad: "miss", na: "axis"};
const SEMT = {ok: "✓", warn: "⚠", bad: "✗", na: "·"};
function fmtGoal(x) { return x.gd.pct ? Math.round(x.v) + "%" : x.v; }
function vGoalsStrip(R) {
  const L = evalGoals(R);
  if (!L.length) return "";
  return `<div class="goals">${L.map(x => `<span class="goal" title="${esc(x.note)}"><i style="--k:var(--${SEMK[x.st]})"></i>${SEMT[x.st]} ${esc(x.gd.label)}: <b>${x.v == null ? "–" : fmtGoal(x)}</b> / ${x.gd.op === "<=" ? "≤" : "≥"}${x.gd.target}${x.gd.pct ? "%" : ""}</span>`).join("")}</div>`;
}
function vGoalsList(R) {
  const L = evalGoals(R);
  if (!L.length) return `<div class="small muted">No hay objetivos marcados. Puedes ponerlos en la pestaña <b>Partido</b>.</div>`;
  return L.map(x => `<div class="gl"><span class="sem" style="--k:var(--${SEMK[x.st]})"></span><div class="lab">${SEMT[x.st]} ${esc(x.gd.label)}<div class="sub">Objetivo ${x.gd.op === "<=" ? "como mucho" : "al menos"} ${x.gd.target}${x.gd.pct ? "%" : ""}${x.note ? " · " + esc(x.note) : ""}</div></div><div class="val">${x.v == null ? "–" : fmtGoal(x)}</div></div>`).join("");
}
function vGoalsEdit(path) {
  const obj = path === "setup" ? (S.setup.goals = S.setup.goals || Object.assign({}, DEF_GOALS)) : (S.game.goals = S.game.goals || {});
  return `<div class="gedit">${GOALS.map(gd => {
    const on = obj[gd.id] != null;
    return `<input type="checkbox" ${on ? "checked" : ""} onchange="setGoal('${path}','${gd.id}',this.checked?${gd.def}:null)">
      <span>${esc(gd.label)} <span class="muted small">${gd.op === "<=" ? "(como mucho)" : "(al menos)"}</span></span>
      <input type="number" inputmode="numeric" value="${on ? obj[gd.id] : gd.def}" ${on ? "" : "disabled"} onchange="setGoal('${path}','${gd.id}',+this.value)">`;
  }).join("")}</div>`;
}
function setGoal(path, id, v) {
  const obj = path === "setup" ? S.setup.goals : S.game.goals;
  if (v == null) delete obj[id]; else obj[id] = v;
  save(); render();
}

/* ---------------- eventos ---------------- */
function addEv(side, pid, type, extra) {
  const g = S.game;
  const e = Object.assign({n: ++g.n, q: g.q, rem: Math.ceil(curRem()), side, pid: pid || null, type}, extra || {});
  g.events.push(e); save();
  if (type !== "IN" && type !== "OUT") showToast(e);
  return e;
}
function state() {
  // estado actual: marcador, quintetos en pista, faltas
  const g = S.game, st = {score: {A: 0, B: 0}, on: {A: [...g.starts[g.q].A], B: [...g.starts[g.q].B]}, pf: {}, tf: {A: 0, B: 0}, to: {A: 0, B: 0}};
  for (const e of g.events) {
    if (PTS[e.type]) st.score[e.side] += PTS[e.type];
    if (FOULS.includes(e.type)) {
      if (e.pid) st.pf[e.pid] = (st.pf[e.pid] || 0) + 1;
      if (e.q === g.q && !(e.type === "CMT" && !e.pid)) st.tf[e.side]++;
    }
    if (e.type === "TOUT") st.to[e.side]++;
    if (e.q === g.q) {
      if (e.type === "OUT") st.on[e.side] = st.on[e.side].filter(x => x !== e.pid);
      if (e.type === "IN" && !st.on[e.side].includes(e.pid)) st.on[e.side].push(e.pid);
    }
  }
  return st;
}

/* ---------------- acciones ---------------- */
function act(type) {
  const pid = sel, side = pid[0];
  sel = null;
  const opp = OTHER[side];
  if (type === "2FGM" || type === "3FGM") { addEv(side, pid, type); prompt = {k: "assist", side, scorer: pid}; }
  else if (type === "2FGA" || type === "3FGA") { addEv(side, pid, type); prompt = {k: "reb", shooter: side}; }
  else if (type === "FTA") { addEv(side, pid, type); prompt = {k: "reb", shooter: side, optional: true}; }
  else if (type === "ST") { addEv(side, pid, type); prompt = {k: "lost", side: opp}; }
  else if (type === "FV") { addEv(side, pid, type); prompt = {k: "blocked", side: opp}; }
  else if (type === "CM") { addEv(side, pid, type); prompt = {k: "fouled", side: opp}; }
  else if (type === "OF") { addEv(side, pid, "OF"); addEv(side, pid, "TO"); }
  else if (type === "MORE") { modal = {k: "more", pid}; }
  else addEv(side, pid, type);
  render();
}
function choose(c) {
  const p = prompt; prompt = null;
  if (p.k === "assist") { if (c) addEv(p.side, c, "AS"); }
  else if (p.k === "reb") {
    if (c) { const side = c[0]; const pid = c.length > 1 ? c : null; addEv(side, pid, side === p.shooter ? "O" : "D"); }
  }
  else if (p.k === "lost") { addEv(p.side, c || null, "TO"); }
  else if (p.k === "blocked") {
    if (c) { addEv(p.side, c, "AG"); addEv(p.side, c, "2FGA"); }
    prompt = {k: "reb", shooter: p.side};
  }
  else if (p.k === "fouled") {
    if (c) { addEv(p.side, c, "RV"); prompt = {k: "ftn", shooter: c}; }
  }
  else if (p.k === "ftn") { if (c > 0) prompt = {k: "ft", shooter: p.shooter, left: c, total: c}; }
  else if (p.k === "ft") {
    const side = p.shooter[0];
    if (c === "in") addEv(side, p.shooter, "FTM"); else addEv(side, p.shooter, "FTA");
    if (p.left > 1) prompt = {k: "ft", shooter: p.shooter, left: p.left - 1, total: p.total};
    else if (c === "out") prompt = {k: "reb", shooter: side};
  }
  render();
}
function teamAct(side, type) {
  if (type === "SUB") { modal = {k: "sub", side, out: [], in: []}; }
  else if (type === "TOUT") { addEv(side, null, "TOUT"); if (S.game.running) toggleClock(); modal = {k: "tm", side}; }
  else addEv(side, null, type);
  render();
}
function undo() {
  const g = S.game; if (!g.events.length) return;
  const last = g.events[g.events.length - 1];
  // los cambios se deshacen por parejas
  const n = (last.type === "IN" || last.type === "OUT") ? g.events.filter(e => e.sub === last.sub && e.sub).length || 1 : 1;
  g.events.splice(g.events.length - n, n);
  prompt = null; sel = null; toast = null; save(); render();
}
function delEv(n) {
  const g = S.game, e = g.events.find(x => x.n === n);
  if (!e) return;
  g.events = g.events.filter(x => x.n !== n && !(e.sub && x.sub === e.sub));
  save(); render();
}
function applySub() {
  const m = modal, g = S.game;
  if (!m.out.length || m.out.length !== m.in.length) return;
  const id = "s" + (++g.n);
  m.out.forEach(p => addEv(m.side, p, "OUT", {sub: id}));
  m.in.forEach(p => addEv(m.side, p, "IN", {sub: id}));
  modal = null; render();
}
function endQuarter() {
  const g = S.game, st = state();
  if (g.running) { g.running = false; }
  g.ended = g.ended || {};
  g.ended[g.q] = true;
  if (g.q >= 4 && st.score.A !== st.score.B) { finishGame(); return; }
  g.q += 1; g.rem = QLEN(g.q);
  g.starts[g.q] = {A: [...st.on.A], B: [...st.on.B]};
  modal = {k: "qstart"};
  save(); render();
}

/* ============================================================
   ANÁLISIS (mismo criterio que el informe de la Euroliga)
   ============================================================ */
function analyze(f) {
  const g = S.game, match = q => f === "all" || q === f;
  const blank = () => ({PTS:0,"2PM":0,"2PA":0,"3PM":0,"3PA":0,FTM:0,FTA:0,OREB:0,DREB:0,AST:0,STL:0,TOV:0,BLK:0,BLKA:0,PF:0,FD:0,SEC:0,PM:0});
  const P = {}, T = {A: blank(), B: blank()};
  for (const s of "AB") for (const p of g.players[s]) P[p.id] = Object.assign(blank(), {id: p.id, side: s, num: p.num, name: p.name, starter: g.starts[1][s].includes(p.id)});
  const lu = {A: {}, B: {}}, X = {A: {}, B: {}};
  for (const s of "AB") X[s] = {pto: 0, sch: 0, fast: 0, bench: 0, poss: 0};
  const qsc = {A: [], B: []};
  const scoring = [];   // para rachas
  let sc = {A: 0, B: 0};
  // posesiones
  let owner = null, origin = null, startT = 0, oreb = false, ended = false, pending = ["START", 0], lastScorer = null;
  const nq = g.q;
  for (let q = 1; q <= nq; q++) {
    if (!g.starts[q]) continue;
    const on = {A: [...g.starts[q].A], B: [...g.starts[q].B]};
    let last = QLEN(q);
    const base = q <= 4 ? 600 * (q - 1) : 2400 + 300 * (q - 5);
    qsc.A[q - 1] = 0; qsc.B[q - 1] = 0;
    owner = null; pending = ["START", base];
    const evs = g.events.filter(e => e.q === q);
    const endRem = (q === g.q && !g.final && !(g.ended || {})[q]) ? curRem() : 0;
    const flush = (to) => {
      const dt = last - to;
      if (dt > 0 && match(q)) for (const s of "AB") {
        on[s].forEach(id => { if (P[id]) P[id].SEC += dt; });
        if (on[s].length === 5) { const k = [...on[s]].sort().join(","); (lu[s][k] = lu[s][k] || {sec: 0, pf: 0, pa: 0, poss: 0}).sec += dt; }
      }
      if (dt > 0) last = to;
    };
    for (const e of evs) {
      flush(e.rem);
      const s = e.side, t = e.type, st = e.pid && P[e.pid] ? P[e.pid] : null, tt = T[s];
      const elapsed = base + QLEN(q) - e.rem;
      if (t === "IN") { if (!on[s].includes(e.pid)) on[s].push(e.pid); continue; }
      if (t === "OUT") { on[s] = on[s].filter(x => x !== e.pid); continue; }
      const pts = PTS[t] || 0;
      if (pts) { sc[s] += pts; qsc[s][q - 1] += pts; }
      // posesiones
      if (t === "D") { owner = s; origin = "REB"; startT = elapsed; oreb = false; ended = false; pending = null; if (match(q)) X[s].poss++; }
      else if (OWN_BALL.includes(t)) {
        const nw = owner !== s || (ended && t !== "FTM" && t !== "FTA");
        if (nw) {
          if (pending) { origin = pending[0]; startT = pending[1]; } else { origin = lastScorer === OTHER[s] ? "MADE" : "OTHER"; startT = elapsed; }
          owner = s; oreb = false; ended = false; pending = null; if (match(q)) X[s].poss++;
        }
        if (t === "O") oreb = true;
        if (pts) {
          lastScorer = s;
          if (match(q)) {
            if (origin === "TO") X[s].pto += pts;
            if (oreb) X[s].sch += pts;
            if ((origin === "TO" || origin === "REB") && elapsed - startT <= 8) X[s].fast += pts;
          }
        }
        if (t === "TO" || t === "OF") { ended = true; pending = ["TO", elapsed]; }
        else if (t === "2FGM" || t === "3FGM") { ended = true; pending = ["MADE", elapsed]; }
      }
      if (!match(q)) continue;
      if (pts) {
        scoring.push({t: elapsed, q, rem: e.rem, side: s, pts, a: sc.A, b: sc.B});
        on[s].forEach(id => P[id] && (P[id].PM += pts));
        on[OTHER[s]].forEach(id => P[id] && (P[id].PM -= pts));
        if (on[s].length === 5) { const k = [...on[s]].sort().join(","); (lu[s][k] = lu[s][k] || {sec: 0, pf: 0, pa: 0}).pf += pts; }
        const o = OTHER[s];
        if (on[o].length === 5) { const k = [...on[o]].sort().join(","); (lu[o][k] = lu[o][k] || {sec: 0, pf: 0, pa: 0}).pa += pts; }
        if (st && !st.starter) X[s].bench += pts;
      }
      for (const o of (st ? [st, tt] : [tt])) {
        switch (t) {
          case "2FGM": o["2PM"]++; o["2PA"]++; o.PTS += 2; break;
          case "2FGA": o["2PA"]++; break;
          case "3FGM": o["3PM"]++; o["3PA"]++; o.PTS += 3; break;
          case "3FGA": o["3PA"]++; break;
          case "FTM": o.FTM++; o.FTA++; o.PTS += 1; break;
          case "FTA": o.FTA++; break;
          case "O": o.OREB++; break; case "D": o.DREB++; break;
          case "AS": o.AST++; break; case "ST": o.STL++; break; case "TO": o.TOV++; break;
          case "FV": o.BLK++; break; case "AG": o.BLKA++; break; case "RV": o.FD++; break;
          case "CM": case "CMU": case "CMT": case "OF": o.PF++; break;
        }
      }
    }
    flush(endRem);
  }
  const fin = o => {
    o.FGM = o["2PM"] + o["3PM"]; o.FGA = o["2PA"] + o["3PA"]; o.REB = o.OREB + o.DREB;
    o.VAL = o.PTS + o.REB + o.AST + o.STL + o.BLK + o.FD - (o.FGA - o.FGM) - (o.FTA - o.FTM) - o.TOV - o.BLKA - o.PF;
    o.EFG = o.FGA ? (o.FGM + .5 * o["3PM"]) / o.FGA : null;
    const tsa = o.FGA + .44 * o.FTA; o.TS = tsa ? o.PTS / (2 * tsa) : null;
    return o;
  };
  Object.values(P).forEach(fin); fin(T.A); fin(T.B);
  const poss = s => T[s].FGA - T[s].OREB + T[s].TOV + .44 * T[s].FTA;
  const avgPoss = (poss("A") + poss("B")) / 2;
  const F = {};
  for (const s of "AB") {
    const o = OTHER[s];
    F[s] = {poss: poss(s), efg: T[s].EFG, tov: (T[s].FGA + .44 * T[s].FTA + T[s].TOV) ? T[s].TOV / (T[s].FGA + .44 * T[s].FTA + T[s].TOV) : null,
      orb: (T[s].OREB + T[s].DREB + T[o].OREB) && (T[s].OREB + T[o].DREB) ? T[s].OREB / (T[s].OREB + T[o].DREB) : null,
      ftr: T[s].FGA ? T[s].FTA / T[s].FGA : null, ortg: avgPoss ? 100 * T[s].PTS / avgPoss : null};
  }
  // rachas
  const runs = []; let cur = null;
  for (const e of scoring) {
    if (cur && cur.side === e.side) { cur.pts += e.pts; cur.end = e; }
    else { if (cur && cur.pts >= 6) runs.push(cur); cur = {side: e.side, pts: e.pts, start: e, end: e}; }
  }
  if (cur && cur.pts >= 6) runs.push(cur);
  // parcial de los últimos 3 minutos jugados
  const nowT = (g.q <= 4 ? 600 * (g.q - 1) : 2400 + 300 * (g.q - 5)) + QLEN(g.q) - curRem();
  const last3 = {A: 0, B: 0};
  if (f === "all") scoring.filter(e => e.t > nowT - 180).forEach(e => last3[e.side] += e.pts);
  const lus = {};
  for (const s of "AB") lus[s] = Object.entries(lu[s]).map(([k, v]) => ({ids: k.split(","), ...v, pm: v.pf - v.pa}))
    .filter(x => x.sec >= 30).sort((a, b) => b.sec - a.sec).slice(0, 6);
  return {P, T, F, X, qsc, runs: runs.reverse(), cur, last3, lus, score: sc};
}

/* ---------------- claves: dónde perdemos / qué funciona ---------------- */
function keys(R) {
  const u = S.setup.us, r = OTHER[u], T = R.T, F = R.F, X = R.X;
  const bad = [], good = [];
  const push = (cond, arr, w, label, text) => { if (cond) arr.push({w, label, text}); };
  const dOR = T[r].OREB - T[u].OREB;
  push(dOR >= 3, bad, dOR * 1.4, "Rebote ofensivo", `Ellos ${T[r].OREB} rebotes ofensivos, nosotros ${T[u].OREB}. Nos han hecho ${X[r].sch} puntos de segunda oportunidad.`);
  push(-dOR >= 3, good, -dOR * 1.4, "Rebote ofensivo", `Cogemos ${T[u].OREB} rebotes ofensivos (ellos ${T[r].OREB}): ${X[u].sch} puntos de segunda oportunidad.`);
  const dTO = T[u].TOV - T[r].TOV;
  push(dTO >= 3 || X[r].pto >= 8, bad, Math.max(dTO, X[r].pto / 3) * 1.3, "Pérdidas", `Llevamos ${T[u].TOV} pérdidas (ellos ${T[r].TOV}) y nos han anotado ${X[r].pto} puntos tras ellas.`);
  push(-dTO >= 3 || X[u].pto >= 8, good, Math.max(-dTO, X[u].pto / 3) * 1.3, "Defensa que roba", `Forzamos ${T[r].TOV} pérdidas y sacamos ${X[u].pto} puntos de ellas.`);
  if (F[u].efg != null && F[r].efg != null) {
    const d = (F[r].efg - F[u].efg) * 100;
    push(d >= 8 && T[r].FGA >= 6, bad, d * .5, "Eficiencia de tiro", `Ellos tiran con un ${Math.round(F[r].efg * 100)}% efectivo y nosotros con un ${Math.round(F[u].efg * 100)}%.`);
    push(-d >= 8 && T[u].FGA >= 6, good, -d * .5, "Eficiencia de tiro", `Tiramos con un ${Math.round(F[u].efg * 100)}% efectivo, ellos un ${Math.round(F[r].efg * 100)}%.`);
  }
  push(T[r]["3PM"] >= 3 && T[r]["3PM"] / T[r]["3PA"] >= .38, bad, T[r]["3PM"] * 2, "Triples rivales", `Nos están castigando de 3: ${T[r]["3PM"]}/${T[r]["3PA"]}.`);
  push(T[u]["3PM"] >= 3 && T[u]["3PM"] / T[u]["3PA"] >= .38, good, T[u]["3PM"] * 2, "Triples", `Estamos acertando de 3: ${T[u]["3PM"]}/${T[u]["3PA"]}.`);
  const dFT = T[r].FTA - T[u].FTA;
  push(dFT >= 5, bad, dFT, "Tiros libres", `Ellos han tirado ${T[r].FTA} tiros libres y nosotros ${T[u].FTA}: estamos haciendo muchas faltas.`);
  push(-dFT >= 5, good, -dFT, "Tiros libres", `Llegamos a la línea: ${T[u].FTA} tiros libres (ellos ${T[r].FTA}).`);
  push(X[r].fast >= 6, bad, X[r].fast, "Transición", `Nos hacen ${X[r].fast} puntos en los primeros 8 segundos de posesión: falta balance defensivo.`);
  push(X[u].fast >= 6, good, X[u].fast, "Transición", `${X[u].fast} puntos nuestros al contraataque o en transición.`);
  const rp = Object.values(R.P).filter(p => p.side === r).sort((a, b) => b.PTS - a.PTS)[0];
  if (rp && rp.PTS >= 8 && rp.PTS >= .3 * T[r].PTS)
    bad.push({w: rp.PTS, label: "Jugador peligroso", text: `#${rp.num}${rp.name ? " " + rp.name : ""} lleva ${rp.PTS} puntos (${rp.FGM}/${rp.FGA} de campo, ${rp.FTM}/${rp.FTA} TL).`});
  const up = Object.values(R.P).filter(p => p.side === u).sort((a, b) => b.VAL - a.VAL)[0];
  if (up && up.VAL >= 8) good.push({w: up.VAL * .8, label: "En racha", text: `#${up.num}${up.name ? " " + up.name : ""}: ${up.PTS} pts, ${up.REB} reb, ${up.AST} as (${up.VAL} de valoración).`});
  bad.sort((a, b) => b.w - a.w); good.sort((a, b) => b.w - a.w);
  return {bad: bad.slice(0, 4), good: good.slice(0, 4)};
}

function toStarters() {

function startGame() {

  try { const t = s.teams[s.us]; localStorage.setItem(ROSTER_KEY, JSON.stringify({name: t.name, roster: t.roster})); } catch (e) {}
  const teams = {}, pl = {};
  for (const side of "AB") {

function alerts(st) {
  if (!S.game || S.game.final) return "";
  const R = analyze("all"), u = S.setup.us, r = OTHER[u], out = [];
  for (const id of st.on[u]) { const f = st.pf[id] || 0; if (f >= 3) out.push([f >= 4 ? "miss" : "foul", `${pshort(id)} · ${f} faltas`]); }
  for (const id of st.on[r]) { const f = st.pf[id] || 0; if (f >= 4) out.push(["made", `Rival ${pshort(id)} con ${f} faltas: atacadle`]); }
  if (st.tf[u] >= 4) out.push(["foul", `Llevamos ${st.tf[u]} faltas en el cuarto: cada falta son tiros libres`]);
  if (st.tf[r] >= 4) out.push(["made", `El rival está en bonus (${st.tf[r]} faltas)`]);
  const c = R.cur;
  if (c && c.pts >= 6 && c.side === r) out.push(["miss", `Parcial 0-${c.pts} en contra · ¿tiempo muerto?`]);
  if (c && c.pts >= 6 && c.side === u) out.push(["made", `Parcial ${c.pts}-0 a favor`]);
  const hot = Object.values(R.P).filter(p => p.side === r && p.PTS >= 10).sort((a, b) => b.PTS - a.PTS)[0];
  if (hot) out.push(["tov", `Peligro: rival #${hot.num} lleva ${hot.PTS} puntos`]);
  return out.length ? `<div class="alerts">${out.map(([k, t]) => `<span class="alert" style="--k:var(--${k})">${esc(t)}</span>`).join("")}</div>` : "";
}

function vPrompt(st) {
  const p = prompt;
  const pbtn = (id, sub) => { const x = pinfo(id); return `<button class="choice" style="--c:var(--${id[0]})" onclick="choose('${id}')">${esc(x.num)}<small>${esc(x.name || sub || "")}</small></button>`; };
  const skip = (l) => `<button class="choice skip" onclick="choose(null)">${l}</button>`;
  let h = "", body = "";
  if (p.k === "assist") { h = "¿Asistencia?"; body = st.on[p.side].filter(x => x !== p.scorer).map(id => pbtn(id)).join("") + skip("Sin asistencia"); }
  else if (p.k === "reb") {
    h = "¿Rebote?";
    body = `<div style="grid-column:1/-1" class="small muted">${esc(tname("A"))}</div>` + st.on.A.map(id => pbtn(id)).join("") + `<button class="choice" style="--c:var(--A);font-size:15px" onclick="choose('A')">Equipo<small>${esc(tcode("A"))}</small></button>`
      + `<div style="grid-column:1/-1" class="small muted">${esc(tname("B"))}</div>` + st.on.B.map(id => pbtn(id)).join("") + `<button class="choice" style="--c:var(--B);font-size:15px" onclick="choose('B')">Equipo<small>${esc(tcode("B"))}</small></button>`
      + skip(p.optional ? "Quedan tiros / nadie" : "Saltar");
  }
  else if (p.k === "lost") { h = "¿Quién la pierde?"; body = st.on[p.side].map(id => pbtn(id)).join("") + skip("No sé"); }
  else if (p.k === "blocked") { h = "¿A quién tapona?"; body = st.on[p.side].map(id => pbtn(id)).join("") + skip("No sé"); }
  else if (p.k === "fouled") { h = "¿Falta sobre quién?"; body = st.on[p.side].map(id => pbtn(id)).join("") + skip("Sin tiros / no sé"); }
  else if (p.k === "ftn") { h = `¿Tiros libres para #${esc(pinfo(p.shooter).num)}?`; body = [0, 1, 2, 3].map(n => `<button class="choice ${n ? "" : "skip"}" onclick="choose(${n})">${n || "Ninguno"}${n ? "<small>tiros</small>" : ""}</button>`).join(""); }
  else if (p.k === "ft") {
    h = `Tiro libre ${p.total - p.left + 1} de ${p.total} · #${esc(pinfo(p.shooter).num)}`;
    body = `<button class="choice yes" onclick="choose('in')">✓ Anotado</button><button class="choice no" onclick="choose('out')">✗ Fallado</button>`;
  }
  return `<div class="card prompt"><h3>${h}</h3><div class="choices">${body}</div></div>`;
}

/* ---------------- informe ---------------- */
function mir(label, a, b, fa, fb, ratio) {
  const m = Math.max(a || 0, b || 0) || 1;
  const wa = ratio ? 100 * (a || 0) : 100 * (a || 0) / m, wb = ratio ? 100 * (b || 0) : 100 * (b || 0) / m;
  return `<div class="mir"><div class="l">${label}</div><div class="a">${fa ?? a}</div><div class="bar a"><i style="width:${wa}%"></i></div>
    <div class="bar b"><i style="width:${wb}%"></i></div><div class="b">${fb ?? b}</div></div>`;
}
function vReport() {
  const g = S.game, R = analyze(rfilter), u = S.setup.us, r = OTHER[u];
  const qs = []; for (let q = 1; q <= g.q; q++) if (g.starts[q]) qs.push(q);
  const seg = `<div class="seg"><button class="${rfilter === "all" ? "on" : ""}" onclick="rfilter='all';render()">Partido</button>${qs.map(q => `<button class="${rfilter === q ? "on" : ""}" onclick="rfilter=${q};render()">${qlab(q)}</button>`).join("")}</div>`;
  const K = keys(R);
  const kb = (arr, cls, empty) => arr.length ? arr.map(k => `<div class="key ${cls}"><b>${esc(k.label)}</b>${esc(k.text)}</div>`).join("") : `<div class="small muted">${empty}</div>`;
  // marcador por cuartos
  const full = analyze("all");
  const qtab = `<div class="scroll"><table><tr><th></th>${qs.map(q => `<th>${qlab(q)}</th>`).join("")}<th>Total</th></tr>${["A", "B"].map(s => `<tr><td><span class="dot" style="--c:var(--${s})"></span>${esc(tcode(s))}</td>${qs.map(q => `<td>${full.qsc[s][q - 1] ?? ""}</td>`).join("")}<td><b>${full.score[s]}</b></td></tr>`).join("")}</table></div>`;
  // rachas
  let runtxt = "";
  if (rfilter === "all") {
    const c = R.cur;
    if (c && c.pts >= 4) runtxt += `<div class="key ${c.side === u ? "good" : "bad"}"><b>Racha en curso</b>${c.pts}-0 de ${esc(tname(c.side))}</div>`;
    runtxt += `<div class="key info"><b>Últimos 3 minutos</b>${esc(tname("A"))} ${R.last3.A} – ${R.last3.B} ${esc(tname("B"))}</div>`;
  }
  runtxt += R.runs.slice(0, 4).map(x => `<div class="key ${x.side === u ? "good" : "bad"}"><b>Parcial ${x.pts}-0 ${esc(tcode(x.side))}</b>${qlab(x.start.q)} ${mmss(x.start.rem)} → ${qlab(x.end.q)} ${mmss(x.end.rem)} (de ${x.start.a - (x.side === "A" ? x.start.pts : 0)}-${x.start.b - (x.side === "B" ? x.start.pts : 0)} a ${x.end.a}-${x.end.b})</div>`).join("");
  // cuatro factores
  const F = R.F, T = R.T, X = R.X;
  const ff = (lab, k, fmt, low) => {
    const a = F[u][k], b = F[r][k];
    let w = "";
    if (a != null && b != null && a !== b) w = ((a > b) !== !!low) ? "▲ nosotros" : "▼ ellos";
    return `<tr><td>${lab}</td><td class="${w.startsWith("▲") ? "win" : ""}">${fmt(a)}</td><td class="${w.startsWith("▼") ? "win" : ""}">${fmt(b)}</td><td class="small">${w}</td></tr>`;
  };
  const P = x => x == null ? "–" : Math.round(x * 100) + "%", N = x => x == null ? "–" : x.toFixed(1);
  const fact = `<table><tr><th>Factor</th><th>${esc(tcode(u))}</th><th>${esc(tcode(r))}</th><th>Gana</th></tr>
    ${ff("Tiro efectivo (eFG%)", "efg", P)}${ff("Pérdidas por posesión", "tov", P, true)}${ff("Rebote ofensivo (RO%)", "orb", P)}${ff("Tiros libres por tiro", "ftr", P)}
    ${ff("Posesiones", "poss", N)}${ff("Puntos por 100 posesiones", "ortg", N)}</table>`;
  const sh = (lab, m, a) => mir(lab, T.A[a] ? T.A[m] / T.A[a] : 0, T.B[a] ? T.B[m] / T.B[a] : 0, `${pct(T.A[m], T.A[a])}<small>${T.A[m]}/${T.A[a]}</small>`, `${pct(T.B[m], T.B[a])}<small>${T.B[m]}/${T.B[a]}</small>`, true);
  const comp = sh("Tiros de campo", "FGM", "FGA") + sh("Tiros de 2", "2PM", "2PA") + sh("Triples", "3PM", "3PA") + sh("Tiros libres", "FTM", "FTA")
    + mir("Rebotes ofensivos", T.A.OREB, T.B.OREB) + mir("Rebotes defensivos", T.A.DREB, T.B.DREB) + mir("Asistencias", T.A.AST, T.B.AST)
    + mir("Pérdidas", T.A.TOV, T.B.TOV) + mir("Robos", T.A.STL, T.B.STL) + mir("Faltas", T.A.PF, T.B.PF)
    + mir("Puntos tras pérdida", X.A.pto, X.B.pto) + mir("Puntos de 2ª oportunidad", X.A.sch, X.B.sch)
    + mir("Puntos en transición (<8 s)", X.A.fast, X.B.fast) + mir("Puntos del banquillo", X.A.bench, X.B.bench);
  // jugadores
  const st = state();
  const ptab = (side, ours) => {
    const rows = Object.values(R.P).filter(p => p.side === side && (p.SEC > 0 || p.PTS || p.PF || p.FGA || p.FTA || p.REB))
      .sort((a, b) => ours ? b.SEC - a.SEC : b.PTS - a.PTS);
    const tot = T[side];
    return `<div class="scroll"><table><tr><th>Jugador</th><th>Min</th><th>Pts</th><th>T2</th><th>T3</th><th>TL</th><th>RO</th><th>RD</th><th>As</th><th>Rob</th><th>Pér</th><th>F</th><th>Val</th><th>+/-</th></tr>

function tg(side, id) { const a = modal[side]; const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else if (a.length < 5) a.push(id); render(); }
function tgs(arr, id) { const a = modal[arr]; const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); render(); }
function setClock() { const v = (document.getElementById("clkin").value || "").match(/^(\d{1,2})[:.]?(\d{2})$/); if (!v) return; const r = +v[1] * 60 + +v[2]; S.game.rem = Math.min(QLEN(S.game.q), r); if (S.game.running) { S.game.remStart = S.game.rem; S.game.t0 = Date.now(); } save(); render(); }
function alertBox(t) { modal = {k: "msg", text: t}; render(); }
function resetAll() { const keep = S.setup; S = fresh(); S.setup.teams[keep.us] = keep.teams[keep.us]; S.setup.us = keep.us; modal = null; view = "setup"; save(); render(); }

/* ---------------- exportar (formato play-by-play de la Euroliga) ---------------- */
function buildExport() {
  const g = S.game, st = analyze("all");
  const KEYS = ["FirstQuarter", "SecondQuarter", "ThirdQuarter", "ForthQuarter"];
  const pbp = {Live: false, TeamA: tname("A"), TeamB: tname("B"), CodeTeamA: tcode("A"), CodeTeamB: tcode("B"),
    ShortTeamA: tname("A"), ShortTeamB: tname("B"), ActualQuarter: g.q, Lineups: {}, Rosters: {}};
  for (const s of "AB") pbp.Rosters[s] = g.players[s].map(p => ({pid: p.id, num: p.num, name: p.name ? p.name.toUpperCase() : "#" + p.num}));
  let n = 0, sc = {A: 0, B: 0};
  const row = (e, q) => {
    const p = e.pid ? pinfo(e.pid) : null;
    if (PTS[e.type]) sc[e.side] += PTS[e.type];
    return {TYPE: 0, NUMBEROFPLAY: ++n, CODETEAM: e.side ? tcode(e.side) : "", PLAYER_ID: e.pid || "", PLAYTYPE: e.type,
      PLAYER: p ? (p.name ? p.name.toUpperCase() : "#" + p.num) : null, TEAM: e.side ? tname(e.side) : null, DORSAL: p ? p.num : null,
      MINUTE: Math.floor((QLEN(q) - e.rem) / 60) + 1, MARKERTIME: e.type === "BP" ? "" : mmss(e.rem),
      POINTS_A: PTS[e.type] ? sc.A : null, POINTS_B: PTS[e.type] ? sc.B : null, COMMENT: "", PLAYINFO: LABEL[e.type] || ""};
  };
  const ot = [];
  for (let q = 1; q <= g.q; q++) {
    if (!g.starts[q]) continue;
    pbp.Lineups[q] = g.starts[q];
    const rows = [row({type: "BP", rem: QLEN(q)}, q)];
    g.events.filter(e => e.q === q).forEach(e => rows.push(row(e, q)));
    rows.push(row({type: "EP", rem: 0}, q));
    if (q <= 4) pbp[KEYS[q - 1]] = rows; else ot.push(...rows);
  }
  if (ot.length) pbp.ExtraTime = ot;
  const lastKey = ot.length ? "ExtraTime" : KEYS[Math.min(g.q, 4) - 1];
  if (g.final && pbp[lastKey]) pbp[lastKey].push(row({type: "EG", rem: 0}, g.q));
  const d = S.setup.date ? S.setup.date.split("-").reverse().join("/") : "";
  const header = {Round: S.setup.jornada || "", Date: d, Hour: S.setup.hour || "", Stadium: S.setup.venue || "",
    TeamA: tname("A"), TeamB: tname("B"), CodeTeamA: tcode("A"), CodeTeamB: tcode("B"), ScoreA: String(st.score.A), ScoreB: String(st.score.B),
    Live: !g.final, Us: S.setup.us, Goals: g.goals || {}, Coach: coachData()};
  return {header, pbp};
}
function fileName() { const r = OTHER[S.setup.us]; return `${S.setup.date || today()}-${mkcode(tname(r), "RIV").toLowerCase()}.json`; }
function exportJSON() {
  const blob = new Blob([JSON.stringify(buildExport())], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName();
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function copyJSON() {
  navigator.clipboard.writeText(JSON.stringify(buildExport())).then(() => alertBox("Datos copiados."), () => alertBox("No se pudo copiar."));
}

/* ============================================================
   SUBIDA AUTOMÁTICA A GITHUB
   El código de acceso (token) se guarda solo en esta tablet.
   ============================================================ */
const GH_KEY = "banquillo-github";
function ghCfg() {
  let c = {};
  try { c = JSON.parse(localStorage.getItem(GH_KEY)) || {}; } catch (e) {}
  return Object.assign({repo: "GuibaneZbasket/banquillo", token: ""}, c);
}
function ghSet(k, v) { const c = ghCfg(); c[k] = (v || "").trim(); try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (e) {} render(); }
function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghReq(method, path, body) {
  const c = ghCfg();
  const r = await fetch(`https://api.github.com/repos/${c.repo}/${path}`, {method,
    headers: Object.assign({Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json"}, body ? {"Content-Type": "application/json"} : {}),
    body: body ? JSON.stringify(body) : undefined});
  let j = null; try { j = await r.json(); } catch (e) {}
  return {ok: r.ok, status: r.status, j};
}
function reportUrl() {
  const [owner, repo] = ghCfg().repo.split("/");
  return `https://${(owner || "").toLowerCase()}.github.io/${repo}/informes/partidos/EQ-${fileName().replace(/\.json$/, "")}.html`;
}
let uploading = false;
async function uploadGame(show) {
  const g = S.game; if (!g || uploading) return;
  const c = ghCfg();
  if (!c.token) { if (show) { modal = {k: "ghsetup"}; render(); } return; }
  uploading = true;
  g.upload = {state: "sending", at: Date.now()}; save();
  if (show) modal = {k: "up"};
  render();
  try {
    const path = `data/partidos/${fileName()}`, st = state();
    const cur = await ghReq("GET", `contents/${path}`);
    const body = {message: `Partido ${S.setup.date}: ${tname("A")} ${st.score.A}-${st.score.B} ${tname("B")}`, content: b64(JSON.stringify(buildExport()))};
    if (cur.ok && cur.j && cur.j.sha) body.sha = cur.j.sha;
    const r = await ghReq("PUT", `contents/${path}`, body);
    if (!r.ok) throw new Error(r.status === 401 ? "El código de acceso no es válido o ha caducado. Revísalo en la pestaña Partido."
      : (r.status === 403 || r.status === 404) ? "El código de acceso no tiene permiso para escribir en el repositorio. Revisa que tenga «Contents: Read and write» sobre banquillo."
      : `GitHub respondió ${r.status}${r.j && r.j.message ? ": " + r.j.message : ""}`);
    g.upload = {state: "ok", at: Date.now(), url: reportUrl()};
  } catch (e) {
    const net = !e || !e.message || /fetch|network|load failed/i.test(e.message);
    g.upload = {state: "error", at: Date.now(), msg: net ? "Sin conexión. Se volverá a intentar solo en cuanto haya internet." : e.message};
  }
  uploading = false; save(); render();
}
async function ghTest() {
  modal = {k: "msg", text: "Comprobando…"}; render();
  try {
    const r = await ghReq("GET", "");
    modal = {k: "msg", text: r.ok ? `✓ Conexión correcta con ${ghCfg().repo}. Al terminar cada partido se subirá solo.`
      : r.status === 401 ? "✗ El código de acceso no es válido." : `✗ No se encuentra el repositorio o no hay permiso (${r.status}).`};
  } catch (e) { modal = {k: "msg", text: "✗ Sin conexión a internet."}; }
  render();
}
function finishGame() {
  const g = S.game;
  g.running = false; g.final = true; g.ended = g.ended || {}; g.ended[g.q] = true;
  modal = null; save(); view = "report";
  uploadGame(true);
  render();
}
function retryPending() { if (S.game && S.game.final && (!S.game.upload || S.game.upload.state !== "ok") && ghCfg().token) uploadGame(false); }
window.addEventListener("online", retryPending);
setInterval(retryPending, 60000);

function vUpStatus() {
  const g = S.game, u = g && g.upload;
  if (!g || !g.final) return "";
  if (!ghCfg().token) return `<div class="key info"><b>Subida a GitHub</b>Sin configurar. Pon el código de acceso abajo y se subirá solo.</div>`;
  if (!u || u.state === "sending") return `<div class="key info"><b>Subida a GitHub</b>Subiendo…</div>`;
  if (u.state === "ok") return `<div class="key good"><b>✓ Partido subido</b>El informe completo estará listo unos 2-3 minutos después de subirlo. <a href="${esc(u.url)}" target="_blank" rel="noopener"><b>Abrir informe →</b></a></div>`;
  return `<div class="key bad"><b>Pendiente de subir</b>${esc(u.msg)} <button class="btn sm" onclick="uploadGame(true)">Reintentar</button></div>`;
}
function vGh() {
  const c = ghCfg();
  return `<details ${c.token ? "" : "open"} class="card" style="padding:0"><summary>☁ Subida automática a GitHub ${c.token ? "· configurada ✓" : "· sin configurar"}</summary><div style="padding:0 14px 14px">
    <p class="small muted" style="margin-top:0">Al pulsar <b>Terminar partido</b> la app sube el partido a tu repositorio y el informe completo se genera solo. Si no hay internet, lo reintenta sola.</p>
    <label>Repositorio</label><input value="${esc(c.repo)}" onchange="ghSet('repo',this.value)">
    <label>Código de acceso de GitHub (token)</label><input type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(c.token)}" onchange="ghSet('token',this.value)">
    <div class="row" style="margin-top:10px"><button class="btn sm" onclick="ghTest()">Probar conexión</button>
    ${S.game && S.game.final ? `<button class="btn sm pri" onclick="uploadGame(true)">Subir ahora</button>` : ""}</div>
    <p class="small muted">El código se guarda solo en esta tablet. Si la pierdes, bórralo en GitHub (Settings → Developer settings → Personal access tokens).</p></div></details>`;
}

/* ---------------- datos para el entrenador (van dentro del archivo exportado) ---------------- */
function coachData() {
  if (!S.game) return null;
  const u = S.setup.us, r = OTHER[u], R = analyze("all"), st = state();
  const strip = k => ({bad: k.bad.map(x => ({label: x.label, text: x.text})), good: k.good.map(x => ({label: x.label, text: x.text}))});
  const out = {us: u, keys: {all: strip(keys(R))}, goals: [], damage: []};
  for (let q = 1; q <= S.game.q; q++) if (S.game.starts[q]) out.keys[q] = strip(keys(analyze(q)));
  out.goals = evalGoals(R).map(x => ({label: x.gd.label, op: x.gd.op, target: x.gd.target, pct: !!x.gd.pct,
    value: x.v == null ? null : (x.gd.pct ? Math.round(x.v) : x.v), status: x.st}));
  out.damage = Object.values(R.P).filter(p => p.side === r && p.PTS > 0).sort((a, b) => b.PTS - a.PTS).slice(0, 4).map(p => {
    const how = [];
    if (p["3PA"]) how.push(`${p["3PM"]}/${p["3PA"]} de 3`);
    if (p["2PA"]) how.push(`${p["2PM"]}/${p["2PA"]} de 2`);
    if (p.FTA) how.push(`${p.FTM}/${p.FTA} TL`);
    if (p.OREB) how.push(`${p.OREB} reb. of.`);
    return {num: p.num, name: p.name, pts: p.PTS, how: how.join(" · "), pf: st.pf[p.id] || 0};
  });
  return out;
}

/* ---------------- reconstruir un partido exportado (para recalcular) ---------------- */
function importGame(exp) {
  const p = exp.pbp, h = exp.header || {}, side = {}, cap = t => t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase());
  side[(p.CodeTeamA || "").trim()] = "A"; side[(p.CodeTeamB || "").trim()] = "B";
  const players = {};
  for (const s of "AB") players[s] = ((p.Rosters || {})[s] || []).map(x => ({id: x.pid, num: String(x.num), name: x.name && !x.name.startsWith("#") ? cap(x.name) : ""}));
  const events = []; let n = 0, q = 0, lastSub = null;
  const add = (rows, qq) => rows.forEach(row => {
    const t = row.PLAYTYPE;
    if (t === "BP") { if (qq === null) q++; return; }
    if (t === "EP" || t === "EG") return;
    const m = (row.MARKERTIME || "00:00").split(":"), rem = +m[0] * 60 + +m[1];
    const e = {n: ++n, q: qq || q, rem, side: side[(row.CODETEAM || "").trim()], pid: (row.PLAYER_ID || "").trim() || null, type: t};
    if (t === "IN" || t === "OUT") {
      if (!(lastSub && lastSub.side === e.side && lastSub.rem === rem && lastSub.q === e.q)) lastSub = {id: "s" + n, side: e.side, rem, q: e.q};
      e.sub = lastSub.id;
    } else lastSub = null;
    events.push(e);
  });
  ["FirstQuarter", "SecondQuarter", "ThirdQuarter", "ForthQuarter"].forEach((k, i) => { if (p[k]) { q = i + 1; add(p[k], i + 1); } });
  if (p.ExtraTime) { q = 4; add(p.ExtraTime, null); }
  const starts = {}; Object.keys(p.Lineups || {}).forEach(k => starts[+k] = p.Lineups[k]);
  const ended = {}; Object.keys(starts).forEach(k => ended[k] = true);
  const d = (h.Date || "").split("/");
  S = {setup: {date: d.length === 3 ? `${d[2]}-${d[1]}-${d[0]}` : today(), hour: h.Hour || "", jornada: h.Round || "", venue: h.Stadium || "", us: h.Us || "A",
      teams: {A: {name: p.ShortTeamA || p.TeamA, roster: ""}, B: {name: p.ShortTeamB || p.TeamB, roster: ""}}, goals: h.Goals || {}},
    game: {q: Math.max(...Object.keys(starts).map(Number)), rem: 0, running: false, events, n, players, starts, ended, final: true,
      teams: {A: {name: p.ShortTeamA || p.TeamA, code: p.CodeTeamA}, B: {name: p.ShortTeamB || p.TeamB, code: p.CodeTeamB}}, goals: h.Goals || {}}};
  return S;
}

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
startTicker(); render(); setTimeout(retryPending, 1500);
</script>
